[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gulf-hazard-interview"
version = "2.0.0"
description = "Gulf Coast Hazard Interview Analysis with CENTAUR Integration"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Jesse Andrews", email = "jesseand@ttu.edu"}
]
keywords = [
    "disaster research",
    "NLP",
    "BERT",
    "interview analysis",
    "housing vulnerability",
    "RAG",
    "CENTAUR",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "faiss-cpu>=1.7.4",
    "sentence-transformers>=2.2.0",
    "transformers>=4.30.0",
    "torch>=2.0.0",
    "httpx>=0.24.0",
    "scikit-learn>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.0.280",
    "mypy>=1.4.0",
    "pre-commit>=3.3.0",
]
anthropic = [
    "anthropic>=0.25.0",
]
r-analysis = [
    # R dependencies managed separately via renv
]

[project.urls]
Homepage = "https://github.com/CECREH-2023/gulf-housing-tenure-recovery"
Documentation = "https://github.com/CECREH-2023/gulf-housing-tenure-recovery#readme"
Repository = "https://github.com/CECREH-2023/gulf-housing-tenure-recovery.git"
Issues = "https://github.com/CECREH-2023/gulf-housing-tenure-recovery/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "config*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "*.yml"]

# =============================================================================
# Testing
# =============================================================================

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "-v",
    "--tb=short",
    "-ra",
]
markers = [
    "unit: Unit tests (fast, no external dependencies)",
    "integration: Integration tests (may require CENTAUR)",
    "slow: Slow tests (embedding generation, etc.)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src", "config"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

# =============================================================================
# Code Quality
# =============================================================================

[tool.black]
line-length = 100
target-version = ["py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.venv
    | build
    | dist
    | \.eggs
    | __pycache__
    | r_analysis
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # function call in default argument
]
exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
    "__pycache__",
    "r_analysis",
]

[tool.ruff.isort]
known-first-party = ["src", "config", "centaur_link"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "r_analysis/",
    "tests/",
]

# =============================================================================
# Environment
# =============================================================================

[tool.setuptools.dynamic]
version = {attr = "src.__version__"}
